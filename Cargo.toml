[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/nathanialwm/ExitiumEngine"

[workspace.dependencies]
# Dev-only: benchmark harness for the 5% regression gate (docs/benchmarks.md).
# Default features off: no rayon or plotters; `cargo xtask bench-ci` only reads
# criterion's JSON estimates.
criterion = { version = "0.8.2", default-features = false }

[workspace.lints.rust]
# Denied by default; designated modules opt in with #[allow(unsafe_code)] (see CLAUDE.md unsafe policy).
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
