[package]
name = "exitium_profiler"
description = "Tracing, Tracy integration and frame statistics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Off by default: without it `profile_scope!` expands to nothing and `tracing`
# is not compiled at all.
profiling = ["dep:tracing"]

[dependencies]
tracing = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "scope"
harness = false

[lints]
workspace = true
